name: Build NEXUS Sidekick APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract NEXUS Android project
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('NEXUS-SIDEKICK-Android-Project.zip')
          if not archive.is_file():
              raise SystemExit(f'Missing project ZIP: {archive}')
          with ZipFile(archive) as z:
              for entry in z.infolist():
                  path = Path(entry.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe ZIP entry: {entry.filename}')
              z.extractall('android-project')
          if not Path('android-project/settings.gradle.kts').is_file():
              raise SystemExit('Android Gradle project not found at ZIP root')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        working-directory: android-project
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK output
        run: test -s android-project/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-SIDEKICK-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
